<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="roti1" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e8c98a"/>
      <stop offset="55%" stop-color="#c9a05a"/>
      <stop offset="100%" stop-color="#a67c3d"/>
    </radialGradient>
    <radialGradient id="roti2" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#edd9a3"/>
      <stop offset="60%" stop-color="#d4b06a"/>
      <stop offset="100%" stop-color="#b88945"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#f5e6d0"/>
  <rect x="0" y="520" width="1200" height="280" fill="#e8d4b8"/>
  <!-- plate -->
  <ellipse cx="600" cy="520" rx="380" ry="90" fill="#f0ebe3" stroke="#d4c4a8" stroke-width="4"/>
  <!-- bottom roti -->
  <ellipse cx="600" cy="470" rx="280" ry="55" fill="#8b6914" opacity="0.25"/>
  <ellipse cx="600" cy="455" rx="270" ry="120" fill="url(#roti1)" stroke="#8a6a35" stroke-width="3"/>
  <ellipse cx="600" cy="450" rx="200" ry="85" fill="none" stroke="#b8924a" stroke-width="2" opacity="0.5"/>
  <!-- top roti slightly offset -->
  <ellipse cx="620" cy="390" rx="250" ry="110" fill="url(#roti2)" stroke="#8a6a35" stroke-width="3"/>
  <ellipse cx="620" cy="385" rx="180" ry="75" fill="none" stroke="#c4a05a" stroke-width="2" opacity="0.45"/>
  <!-- ghee gloss -->
  <ellipse cx="580" cy="370" rx="40" ry="12" fill="#fff8e7" opacity="0.35"/>
  <text x="600" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#5c4030">Bajra Roti</text>
  <text x="600" y="745" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#7a5c40">Pearl millet flatbread</text>
</svg>
